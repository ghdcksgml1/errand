[package]
name = "errand-app"
description = "The Errand executable: command-line modes, the runtime and the platform it runs on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "errand"
path = "src/main.rs"

[features]
# Native UI E2E checks require a logged-in desktop session; keep them out of headless CI.
native-e2e = []

[[test]]
name = "onboarding_e2e"
harness = false
required-features = ["native-e2e"]

[dependencies]
errand-core.workspace = true
errand-io.workspace = true
jiff.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
errand-macos.workspace = true
objc2 = "0.6"
objc2-app-kit = "0.3"

[target.'cfg(windows)'.dependencies]
errand-windows.workspace = true
