[package]
name = "errand-app"
description = "The Errand executable: command-line modes, the runtime and the platform it runs on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "errand"
path = "src/main.rs"

[dependencies]
errand-core.workspace = true
errand-io.workspace = true
jiff.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
errand-macos.workspace = true
objc2 = "0.6"
objc2-app-kit = "0.3"

[target.'cfg(windows)'.dependencies]
errand-windows.workspace = true
