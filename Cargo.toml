[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
errand-core = { path = "crates/errand-core" }
errand-io = { path = "crates/errand-io" }
errand-macos = { path = "crates/errand-macos" }
errand-windows = { path = "crates/errand-windows" }
jiff = "0.2"
memchr = "2"
plist = "1"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
tempfile = "3"
unicode-segmentation = "1"

[profile.release]
lto = true
codegen-units = 1
